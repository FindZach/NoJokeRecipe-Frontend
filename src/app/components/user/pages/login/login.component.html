<!-- src/app/auth/login/login.component.html -->
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Log In to NoJokeRecipes</h2>
      <p>Welcome back! Please enter your credentials.</p>
    </div>

    <div class="auth-body">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Enter your email"
            [class.is-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
          >
          <div class="error-message" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email</span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="Enter your password"
            [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
          >
          <div class="error-message" *ngIf="loginForm.get('password')?.touched && f['password'].errors">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox"> Remember me
          </label>
          <a routerLink="/forgot-password" class="forgot-password">Forgot Password?</a>
        </div>

        <div class="error-alert" *ngIf="error">
          {{ error }}
        </div>

        <button type="submit" class="auth-button" [disabled]="loginForm.invalid || loading">
          <span *ngIf="loading">
            <i class="fas fa-spinner fa-spin"></i> Logging in...
          </span>
          <span *ngIf="!loading">Log In</span>
        </button>
      </form>

      <div class="auth-divider">
        <span>OR</span>
      </div>

      <div class="social-auth">
        <button class="google-btn">
          <i class="fab fa-google"></i> Continue with Google
        </button>
      </div>
    </div>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/signup">Sign Up</a></p>
    </div>
  </div>
</div>
